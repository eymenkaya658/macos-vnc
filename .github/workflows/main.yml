name: macOS 26 VNC - Xcode & iOS Geliştirme (6 Saat)
on:
  workflow_dispatch:

jobs:
  macos-vnc-xcode:
    runs-on: macos-26
    timeout-minutes: 360
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Tailscale'e Bağlan
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          args: --hostname=github-runner-mac26

      - name: Admin Şifresini Değiştir ve VNC'yi Etkinleştir
        env:
          NEW_PASSWORD: ${{ secrets.NEW_PASSWORD }}
        run: |
          ADMIN_USER=$(whoami)
          echo "Kullanıcı Adı: $ADMIN_USER"
          
          # macOS uyumlu dscl komutu ile şifreyi (Password@123!) güvenli bir şekilde değiştiriyoruz
          sudo dscl . -passwd /Users/$ADMIN_USER "$NEW_PASSWORD"
          echo "Admin şifresi başarıyla güncellendi!"

          # Ekran Paylaşımı (VNC) ve Uzaktan Yönetimi Aktif Et
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users "$ADMIN_USER" -privs -all -restart -agent -menu
          sudo defaults write /var/db/launchd.db/com.apple.launchd/overrides.plist com.apple.screensharing -dict Disabled -bool false
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Bilgileri Yazdır
          echo "Tailscale IP Adresiniz:"
          tailscale ip -4
          echo "Bağlantı URL'i: vnc://$ADMIN_USER@$(tailscale ip -4)"

      - name: Xcode ve iOS Sürümlerini Kontrol Et
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list devices available

      - name: 6 Saat Boyunca Ortamı Açık Tut
        run: |
          echo "Bağlantı aktif. 6 saat boyunca iOS projenizi geliştirebilirsiniz."
          sleep 21600
